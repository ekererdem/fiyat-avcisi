name: APK derle

on:
  push:
    branches: [main, "dev-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Eşleştirme testleri
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee build.log

      - name: Test raporu
        if: always()
        shell: bash
        run: |
          f=app/build/match-report.txt
          if [ -f "$f" ]; then
            head -1 "$f" | while IFS= read -r l; do echo "::notice::$l"; done
            tail -n +2 "$f" | head -60 | while IFS= read -r l; do echo "::warning title=Eşleştirme::$l"; done
            cat "$f"
          fi

      - name: Derle
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee -a build.log

      - name: Derleme hatalarını özetle
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A 2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: APK'yı yayınla
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FiyatAvcisi-test.apk
          gh release create "test-${{ github.run_number }}" FiyatAvcisi-test.apk \
            --title "Deneme ${{ github.run_number }}" \
            --notes "Okuma testi APK'sı"

      - name: Uygulama içi güncelleme için "latest" sürümünü yenile
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R=repos/${{ github.repository }}/releases
          # Uygulama "güncelleme var mı" kontrolünde bu nottaki sürümü okur
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NOTES="Sürüm $VN ($VC) · Son derleme: $GITHUB_SHA"
          cp FiyatAvcisi-test.apk FiyatAvcisi.apk
          for id in $(gh api $R --jq '.[] | select(.draft) | .id'); do gh api -X DELETE $R/$id || true; done
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if ! gh api $R/tags/latest >/dev/null 2>&1; then
            gh release create latest --title "Fiyat Avcısı" --notes "$NOTES" --verify-tag
          fi
          gh release upload latest FiyatAvcisi.apk --clobber
          gh release edit latest --draft=false --latest --title "Fiyat Avcısı" --notes "$NOTES"
